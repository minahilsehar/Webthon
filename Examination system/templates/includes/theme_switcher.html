{% load static %}
<div class="theme-controls" x-data role="group" aria-label="Appearance settings">
    <form class="theme-picker" method="post" action="{% url 'save_theme' %}" {% if user.is_authenticated %}hx-post="{% url 'save_theme' %}" hx-trigger="change" hx-swap="none" hx-sync="this:replace" hx-on::before-request="document.getElementById('theme-preference-status').textContent = 'Saving theme preference.';" hx-on::after-request="document.getElementById('theme-preference-status').textContent = event.detail.successful ? 'Theme saved to your profile.' : 'Theme changed on this device, but profile sync failed.';"{% endif %}>
        {% csrf_token %}
        <fieldset role="radiogroup" aria-label="Color theme">
            <label class="theme-option">
                <input type="radio" name="theme" value="ivory" aria-label="Ivory theme" x-model="$store.theme.current" @change="$store.theme.select($event.target.value)" {% if user.theme|default:"ivory" == "ivory" %}checked{% endif %}>
                <span class="theme-swatch" data-theme-choice="ivory" aria-hidden="true"></span>
            </label>
            <label class="theme-option">
                <input type="radio" name="theme" value="lavender" aria-label="Lavender theme" x-model="$store.theme.current" @change="$store.theme.select($event.target.value)" {% if user.theme|default:"ivory" == "lavender" %}checked{% endif %}>
                <span class="theme-swatch" data-theme-choice="lavender" aria-hidden="true"></span>
            </label>
            <label class="theme-option">
                <input type="radio" name="theme" value="mauve" aria-label="Mauve theme" x-model="$store.theme.current" @change="$store.theme.select($event.target.value)" {% if user.theme|default:"ivory" == "mauve" %}checked{% endif %}>
                <span class="theme-swatch" data-theme-choice="mauve" aria-hidden="true"></span>
            </label>
            <label class="theme-option">
                <input type="radio" name="theme" value="rose" aria-label="Rose theme" x-model="$store.theme.current" @change="$store.theme.select($event.target.value)" {% if user.theme|default:"ivory" == "rose" %}checked{% endif %}>
                <span class="theme-swatch" data-theme-choice="rose" aria-hidden="true"></span>
            </label>
            <label class="theme-option">
                <input type="radio" name="theme" value="sage" aria-label="Sage theme" x-model="$store.theme.current" @change="$store.theme.select($event.target.value)" {% if user.theme|default:"ivory" == "sage" %}checked{% endif %}>
                <span class="theme-swatch" data-theme-choice="sage" aria-hidden="true"></span>
            </label>
            <label class="theme-option">
                <input type="radio" name="theme" value="plum" aria-label="Plum theme" x-model="$store.theme.current" @change="$store.theme.select($event.target.value)" {% if user.theme|default:"ivory" == "plum" %}checked{% endif %}>
                <span class="theme-swatch" data-theme-choice="plum" aria-hidden="true"></span>
            </label>
        </fieldset>
    </form>
    <button class="theme-mode-toggle" type="button" role="switch" :aria-label="$store.theme.current === 'plum' ? 'Switch to light theme' : 'Switch to dark theme'" :aria-checked="$store.theme.current === 'plum'" @click="$store.theme.toggle()">
        <span class="theme-mode-track" aria-hidden="true">
            <img class="theme-mode-image" x-cloak x-show="$store.theme.current !== 'plum'" src="{% static 'images/theme-day.png' %}" alt="">
            <img class="theme-mode-image" x-cloak x-show="$store.theme.current === 'plum'" src="{% static 'images/theme-night.png' %}" alt="">
        </span>
    </button>
    <p id="theme-preference-status" class="visually-hidden" role="status" aria-live="polite" aria-atomic="true" x-text="$store.theme.status"></p>
</div>
